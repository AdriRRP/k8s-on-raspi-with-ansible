- name: Check if iptables is installed
  command: which iptables
  register: iptables_check
  changed_when: false
  failed_when: false

- name: Set fact for iptables availability
  set_fact:
    iptables_installed: "{{ iptables_check.rc == 0 }}"

- name: Check if UFW is installed
  command: which ufw
  register: ufw_check
  changed_when: false
  failed_when: false

- name: Check if UFW is active
  command: ufw status
  register: ufw_status
  when: ufw_check.rc == 0
  changed_when: false
  failed_when: false

- name: Set facts for UFW
  set_fact:
    ufw_installed: "{{ ufw_check.rc == 0 }}"
    ufw_active: "{{ 'Status: active' in (ufw_status.stdout | default('')) }}"
