- name: Set facts for dynamic port range
  set_fact:
    dynamic_port_min: "{{ dynamic_ports | min }}"
    dynamic_port_max: "{{ dynamic_ports | max }}"

- name: Allow static Kubernetes ports through UFW
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ static_ports | select('number') | list }}"
  when:
    - ufw_installed | default(false)
    - ufw_active | default(false)
  become: true
  changed_when: true

- name: Allow NodePort range through UFW
  shell: >
    ufw allow {{ dynamic_port_min }}:{{ dynamic_port_max }}/tcp
  when:
    - ufw_installed | default(false)
    - ufw_active | default(false)
  become: true
  changed_when: true

- name: Show current UFW rules (filtered summary)
  shell: ufw status numbered
  register: ufw_status_output
  when: ufw_installed | default(false)
  changed_when: false
  failed_when: false

- name: Display summary of UFW rules applied
  debug:
    var: ufw_status_output.stdout_lines
  when: ufw_status_output.stdout_lines is defined
