---
- name: Ensure mount point exists
  file:
    path: "{{ nfs_export_mount }}"
    state: directory
    mode: '0755'
  become: true

- name: Get UUID of device
  command: blkid -s UUID -o value {{ nfs_export_device }}
  register: nfs_uuid
  changed_when: false
  become: true

- name: Mount device with fstab entry
  mount:
    path: "{{ nfs_export_mount }}"
    src: "UUID={{ nfs_uuid.stdout }}"
    fstype: ext4
    opts: defaults
    state: mounted
  become: true
