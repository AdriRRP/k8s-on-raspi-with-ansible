---
- name: Deploy node-exporter DaemonSet
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'node-exporter-daemonset.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Deploy node-exporter Service
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'node-exporter-service.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Wait until all node-exporter pods are in Running phase
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ monitoring_namespace }}"
    label_selectors:
      - app=node-exporter
    kubeconfig: "{{ kubeconfig_local_path }}"
  register: node_exporter_pods
  retries: 10
  delay: 10
  until:
    - node_exporter_pods.resources | length > 0
    - node_exporter_pods.resources | map(attribute='status.phase') | select('equalto', 'Running') | list | length == node_exporter_pods.resources | length
  changed_when: false

- name: Confirm node-exporter is deployed and ready
  ansible.builtin.debug:
    msg: "node-exporter is running on {{ node_exporter_pods.resources | length }} node(s)."

- name: Get Prometheus LoadBalancer IP from Service
  shell: >
    kubectl get svc -n {{ monitoring_namespace }} prometheus
    -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
    --kubeconfig={{ kubeconfig_local_path }}
  register: prometheus_ip
  changed_when: false

- name: Wait until Prometheus API returns node-exporter metrics
  uri:
    url: "http://{{ prometheus_ip.stdout }}:9090/api/v1/query?query=node_cpu_seconds_total"
    method: GET
    return_content: true
    status_code: 200
  register: node_exporter_metrics
  retries: 5
  delay: 10
  until: >
    node_exporter_metrics.json is defined and
    node_exporter_metrics.json.status == "success" and
    node_exporter_metrics.json.data.result | length > 0
  changed_when: false

- name: Confirm Prometheus is collecting node-exporter metrics
  ansible.builtin.debug:
    msg: "Prometheus is scraping node-exporter metrics successfully ({{ node_exporter_metrics.json.data.result | length }} series found)."
