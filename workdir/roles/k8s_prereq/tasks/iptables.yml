---
- name: Remove legacy broad Kubernetes TCP accept rules
  ansible.builtin.shell: >
    iptables -D INPUT -p tcp --dport {{ item }} -j ACCEPT 2>/dev/null || true
  loop: "{{ k8s_prereq_legacy_static_ports }}"
  become: true
  changed_when: false

- name: Remove legacy broad NodePort accept rule
  ansible.builtin.shell: >
    iptables -D INPUT -p tcp --dport
    {{ k8s_prereq_legacy_node_port_range }} -j ACCEPT 2>/dev/null || true
  become: true
  changed_when: false

- name: Gather service state before reconciling netfilter persistence
  ansible.builtin.service_facts:
  when: k8s_prereq_disable_dynamic_netfilter_persistence | bool
  become: true

- name: Detect persisted Kubernetes or Calico rules
  ansible.builtin.command:
    argv:
      - grep
      - -Eqs
      - (^|[-:])(KUBE|cali|CALI)
      - "{{ item }}"
  loop:
    - /etc/iptables/rules.v4
    - /etc/iptables/rules.v6
  register: k8s_prereq_dynamic_persistent_rules
  changed_when: false
  failed_when: false
  when:
    - k8s_prereq_disable_dynamic_netfilter_persistence | bool
    - "'netfilter-persistent.service' in ansible_facts.services"
  become: true

- name: Disable restoration of dynamic Kubernetes network snapshots
  ansible.builtin.systemd_service:
    name: netfilter-persistent.service
    enabled: false
    masked: true
    state: stopped
  when:
    - k8s_prereq_disable_dynamic_netfilter_persistence | bool
    - "'netfilter-persistent.service' in ansible_facts.services"
    - >-
      k8s_prereq_dynamic_persistent_rules.results
      | selectattr('rc', 'defined')
      | selectattr('rc', 'equalto', 0)
      | list
      | length > 0
  become: true

- name: Clear stale netfilter-persistent failure state
  ansible.builtin.command: systemctl reset-failed netfilter-persistent.service
  when:
    - k8s_prereq_disable_dynamic_netfilter_persistence | bool
    - "'netfilter-persistent.service' in ansible_facts.services"
    - >-
      k8s_prereq_dynamic_persistent_rules.results
      | selectattr('rc', 'defined')
      | selectattr('rc', 'equalto', 0)
      | list
      | length > 0
  changed_when: false
  become: true
