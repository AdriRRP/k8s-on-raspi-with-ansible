---
- name: Gather memory facts required for kubelet reservations
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - hardware
  when: ansible_facts.memtotal_mb is not defined

- name: Classify node size for kubelet reservations
  ansible.builtin.set_fact:
    kubelet_reserved_profile_key: >-
      {{
        'small' if ansible_facts.memtotal_mb <= 2048 else
        'medium' if ansible_facts.memtotal_mb <= 4096 else
        'large' if ansible_facts.memtotal_mb <= 8192 else
        'xlarge'
      }}

- name: Derive kubelet reservation values for this node
  ansible.builtin.set_fact:
    kubelet_reserved_cpu: "{{ kubelet_reserved_profiles[kubelet_reserved_profile_key].cpu }}"
    kubelet_reserved_memory: "{{ kubelet_reserved_profiles[kubelet_reserved_profile_key].memory }}"
    kubelet_eviction_memory_available: "{{ kubelet_reserved_profiles[kubelet_reserved_profile_key].eviction_memory_available }}"

- name: Ensure kubelet drop-in directory exists
  ansible.builtin.file:
    path: "{{ kubelet_config_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Configure kubelet extra args
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: |
      KUBELET_EXTRA_ARGS="{{ kubelet_extra_args }}"
    owner: root
    group: root
    mode: '0644'
  register: kubelet_extra_args_config
  become: true

- name: Deploy kubelet optimization config
  ansible.builtin.template:
    src: kubelet-optimization.conf.j2
    dest: "{{ kubelet_config_dropin_path }}"
    owner: root
    group: root
    mode: '0644'
  register: kubelet_optimization_config
  become: true

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
  become: true

- name: Restart kubelet to apply node tuning
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
  when:
    - kubelet_extra_args_config is changed or kubelet_optimization_config is changed
    - ansible_facts['service_mgr'] == 'systemd'
  become: true
