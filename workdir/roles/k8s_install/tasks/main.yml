---
- name: Ensure APT repositories are healthy before Kubernetes package install
  ansible.builtin.include_role:
    name: apt_resilience

- name: Configure Kubernetes APT repository
  ansible.builtin.import_tasks: repo.yml

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install Kubernetes components
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - "kubeadm={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - "kubectl={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
    allow_downgrade: true
    state: present
  become: true

- name: Hold kubelet, kubeadm and kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true

- name: Classify node size for kubelet reservations
  ansible.builtin.set_fact:
    kubelet_reserved_profile_key: >-
      {{
        'small' if ansible_memtotal_mb <= 2048 else
        'medium' if ansible_memtotal_mb <= 4096 else
        'large' if ansible_memtotal_mb <= 8192 else
        'xlarge'
      }}

- name: Derive kubelet reservation values for this node
  ansible.builtin.set_fact:
    kubelet_reserved_cpu: "{{ kubelet_reserved_profiles[kubelet_reserved_profile_key].cpu }}"
    kubelet_reserved_memory: "{{ kubelet_reserved_profiles[kubelet_reserved_profile_key].memory }}"
    kubelet_eviction_memory_available: "{{ kubelet_reserved_profiles[kubelet_reserved_profile_key].eviction_memory_available }}"

- name: Ensure kubelet drop-in directory exists
  ansible.builtin.file:
    path: "{{ kubelet_config_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Configure kubelet extra args
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: |
      KUBELET_EXTRA_ARGS="{{ kubelet_extra_args }}"
    owner: root
    group: root
    mode: '0644'
  register: kubelet_extra_args_config
  become: true

- name: Deploy kubelet optimization config
  ansible.builtin.template:
    src: kubelet-optimization.conf.j2
    dest: "{{ kubelet_config_dropin_path }}"
    owner: root
    group: root
    mode: '0644'
  register: kubelet_optimization_config
  become: true

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
  become: true

- name: Restart kubelet to apply node tuning
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
  when:
    - kubelet_extra_args_config is changed or kubelet_optimization_config is changed
    - ansible_facts['service_mgr'] == 'systemd'
  become: true
