---
- name: Ensure APT repositories are healthy before Kubernetes package install
  ansible.builtin.include_role:
    name: apt_resilience

- name: Configure Kubernetes APT repository
  ansible.builtin.import_tasks: repo.yml

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install Kubernetes components
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - "kubeadm={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - "kubectl={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
    allow_downgrade: true
    state: present
  become: true

- name: Hold kubelet, kubeadm and kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true

- name: Configure kubelet
  ansible.builtin.import_tasks: configure-kubelet.yml
