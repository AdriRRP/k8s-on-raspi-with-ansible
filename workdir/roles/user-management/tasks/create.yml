---
- name: Ensure admin user exists
  ansible.builtin.user:
    name: admin
    groups: sudo
    shell: /bin/bash
    state: present
    create_home: yes
  tags: user

- name: Authorize control host SSH public key for admin
  ansible.builtin.authorized_key:
    user: admin
    key: "{{ lookup('file', '/home/ansible/.ssh/id_ed25519.pub') }}"
    state: present
    manage_dir: true
  tags: ssh

- name: Allow admin to use sudo without password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/admin
    content: "admin ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: '0440'
  tags: sudo
