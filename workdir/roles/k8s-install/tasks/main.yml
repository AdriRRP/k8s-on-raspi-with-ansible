- name: Ensure /etc/apt/keyrings exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Remove existing (potentially broken) Kubernetes GPG key
  file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: absent
  become: true

- name: Download Kubernetes GPG key as .asc
  get_url:
    url: "{{ kubernetes_apt_key_url }}"
    dest: /tmp/kubernetes-apt-key.asc
    mode: '0644'
  become: true

- name: Convert Kubernetes GPG key to dearmored .gpg format
  command: >
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-apt-key.asc
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true

- name: Add Kubernetes APT repository
  apt_repository:
    repo: "{{ kubernetes_apt_repo }}"
    filename: kubernetes
    state: present
  become: true

- name: Update APT cache
  apt:
    update_cache: true
  become: true

- name: Install Kubernetes components
  apt:
    name:
      - "kubelet={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - "kubeadm={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - "kubectl={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
    allow_downgrade: true
    state: present
  become: true

- name: Hold kubelet, kubeadm and kubectl
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true

- name: Enable and start kubelet
  systemd:
    name: kubelet
    enabled: true
    state: started
  become: true
