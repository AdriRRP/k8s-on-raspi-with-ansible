---
- name: Define connectivity DaemonSet identity
  ansible.builtin.set_fact:
    connectivity_daemonset_name: connectivity-daemonset-test
    connectivity_daemonset_label: connectivity-daemonset-test

- name: Run inter-node connectivity verification
  block:
    - name: Deploy DaemonSet for inter-node connectivity test
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: "{{ connectivity_daemonset_name }}"
            namespace: default
            labels:
              app: "{{ connectivity_daemonset_label }}"
          spec:
            selector:
              matchLabels:
                app: "{{ connectivity_daemonset_label }}"
            template:
              metadata:
                labels:
                  app: "{{ connectivity_daemonset_label }}"
              spec:
                containers:
                  - name: test
                    image: "{{ platform_smoke_test_image }}"
                    command: ["sh", "-c", "sleep 3600"]
                    imagePullPolicy: IfNotPresent
      register: connectivity_test_ds
      failed_when: connectivity_test_ds.failed is defined and connectivity_test_ds.failed
      changed_when: false
      delegate_to: localhost

    - name: Get number of Ready nodes
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - --output=name
          - "--kubeconfig={{ kubeconfig_local_path }}"
      register: expected_pods
      changed_when: false
      delegate_to: localhost

    - name: Wait for DaemonSet pods to be Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - daemonset
          - "{{ connectivity_daemonset_name }}"
          - --output=jsonpath={.status.numberReady}
          - "--kubeconfig={{ kubeconfig_local_path }}"
      register: ready_pods
      retries: 20
      delay: 5
      until: ready_pods.stdout | int == expected_pods.stdout_lines | length
      changed_when: false
      delegate_to: localhost

    - name: Get list of pods and their IPs
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - --selector
          - "app={{ connectivity_daemonset_label }}"
          - --output=json
          - "--kubeconfig={{ kubeconfig_local_path }}"
      register: pod_ips
      changed_when: false
      delegate_to: localhost

    - name: Initialize connectivity Pod list
      ansible.builtin.set_fact:
        pod_info: []

    - name: Parse pod names and IPs into native Ansible data
      ansible.builtin.set_fact:
        pod_info: >-
          {{
            pod_info
            + [{'name': item.metadata.name, 'ip': item.status.podIP}]
          }}
      loop: "{{ (pod_ips.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Check inter-node connectivity from each pod
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - --namespace=default
          - "{{ item.0.name }}"
          - "--kubeconfig={{ kubeconfig_local_path }}"
          - --
          - ping
          - -c
          - "3"
          - -W
          - "2"
          - "{{ item.1.ip }}"
      loop: "{{ pod_info | product(pod_info) | list }}"
      loop_control:
        label: "Ping from {{ item.0.name }} to {{ item.1.name }}"
      when: item.0.name != item.1.name
      changed_when: false
      register: ping_checks
      delegate_to: localhost
  always:
    - name: Cleanup DaemonSet
      kubernetes.core.k8s:
        state: absent
        kind: DaemonSet
        name: "{{ connectivity_daemonset_name }}"
        namespace: default
        kubeconfig: "{{ kubeconfig_local_path }}"
      failed_when: false
      changed_when: false
      delegate_to: localhost
