---
- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ monitoring_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Create ServiceAccount for Prometheus
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'prometheus-serviceaccount.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Create ClusterRole for Prometheus
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'prometheus-clusterrole.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Create ClusterRoleBinding for Prometheus
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'prometheus-clusterrolebinding.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Create least-scope Zot scrape credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: zot-scrape-credentials
        namespace: "{{ monitoring_namespace }}"
      type: Opaque
      stringData:
        ca.crt: "{{ lookup('ansible.builtin.file', registry_ca_cert_path) }}"
        username: "{{ registry_metrics_username }}"
        password: "{{ lookup('ansible.builtin.file', registry_metrics_password_path) }}"
  no_log: true
  when: registry_tls_enabled | bool

- name: Create ConfigMap for Prometheus configuration
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'prometheus-configmap.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Deploy Prometheus PVC
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'prometheus-pvc.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Deploy Prometheus Deployment
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'prometheus-deployment.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Deploy Prometheus Service
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'prometheus-service.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Wait until Prometheus deployment is updated and ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ monitoring_namespace }}"
    name: prometheus
    kubeconfig: "{{ kubeconfig_local_path }}"
  register: prometheus_deployment
  retries: 10
  delay: 10
  until:
    - prometheus_deployment.resources | length > 0
    - >-
      prometheus_deployment.resources[0].status.observedGeneration | default(0) | int
      >= prometheus_deployment.resources[0].metadata.generation | default(0) | int
    - >-
      prometheus_deployment.resources[0].status.updatedReplicas | default(0) | int
      == prometheus_deployment.resources[0].spec.replicas | default(1) | int
    - >-
      prometheus_deployment.resources[0].status.readyReplicas | default(0) | int
      == prometheus_deployment.resources[0].spec.replicas | default(1) | int
    - >-
      prometheus_deployment.resources[0].status.availableReplicas | default(0) | int
      == prometheus_deployment.resources[0].spec.replicas | default(1) | int
  changed_when: false

- name: Ensure previous Prometheus smoke pod is absent
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    name: prometheus-smoke
    namespace: "{{ monitoring_namespace }}"
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost

- name: Create Prometheus smoke pod
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Pod
      metadata:
        name: prometheus-smoke
        namespace: "{{ monitoring_namespace }}"
      spec:
        restartPolicy: Never
        containers:
          - name: smoke
            image: "{{ platform_smoke_test_image }}"
            command: ["sh", "-c", "sleep 300"]
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost

- name: Wait until Prometheus smoke pod is ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    name: prometheus-smoke
    namespace: "{{ monitoring_namespace }}"
    kubeconfig: "{{ kubeconfig_local_path }}"
  register: prometheus_smoke_pod
  retries: 12
  delay: 5
  until:
    - prometheus_smoke_pod.resources | length > 0
    - prometheus_smoke_pod.resources[0].status.phase == "Running"
    - prometheus_smoke_pod.resources[0].status.containerStatuses is defined
    - prometheus_smoke_pod.resources[0].status.containerStatuses | selectattr('ready', 'equalto', true) | list | length == 1
  changed_when: false
  delegate_to: localhost

- name: Verify Prometheus health endpoint from inside the cluster
  ansible.builtin.shell: >
    kubectl exec -n {{ monitoring_namespace }} prometheus-smoke --kubeconfig={{ kubeconfig_local_path }} --
    wget -qO- http://prometheus.{{ monitoring_namespace }}.svc.cluster.local:9090/-/healthy
  register: prometheus_healthcheck
  changed_when: false
  failed_when: "'Healthy' not in prometheus_healthcheck.stdout"
  delegate_to: localhost

- name: Verify Kubernetes scrape jobs have active series
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ monitoring_namespace }}"
      - prometheus-smoke
      - "--kubeconfig={{ kubeconfig_local_path }}"
      - --
      - wget
      - -qO-
      - >-
        http://prometheus.{{ monitoring_namespace }}.svc.cluster.local:9090/api/v1/query?query={{
          ('up{job="' ~ item ~ '"}') | urlencode
        }}
  loop:
    - kubernetes-apiservers
    - kubernetes-nodes
    - kubernetes-cadvisor
    - coredns
  register: prometheus_kubernetes_scrape_checks
  changed_when: false
  failed_when: >-
    '"status":"success"' not in prometheus_kubernetes_scrape_checks.stdout
    or '"result":[]' in prometheus_kubernetes_scrape_checks.stdout
  delegate_to: localhost

- name: Detect Zot registry service
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: "{{ registry_namespace }}"
    name: "{{ registry_name }}"
    kubeconfig: "{{ kubeconfig_local_path }}"
  register: prometheus_zot_registry_service
  delegate_to: localhost

- name: Verify Prometheus is scraping Zot when installed
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ monitoring_namespace }}"
      - prometheus-smoke
      - "--kubeconfig={{ kubeconfig_local_path }}"
      - --
      - wget
      - -qO-
      - >-
        http://prometheus.{{ monitoring_namespace }}.svc.cluster.local:9090/api/v1/query?query={{
          'up{job="zot-registry"}' | urlencode
        }}
  register: prometheus_zot_scrape_check
  retries: 12
  delay: 5
  until:
    - >-
      '"status":"success"' in prometheus_zot_scrape_check.stdout
    - >-
      '"result":[]' not in prometheus_zot_scrape_check.stdout
    - >-
      '"1"' in prometheus_zot_scrape_check.stdout
  when: prometheus_zot_registry_service.resources | length > 0
  changed_when: false
  delegate_to: localhost

- name: Detect optional NodeLocal DNS deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    namespace: kube-system
    name: node-local-dns
    kubeconfig: "{{ kubeconfig_local_path }}"
  register: prometheus_node_local_dns
  delegate_to: localhost

- name: Verify NodeLocal DNS metrics when the cache is installed
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ monitoring_namespace }}"
      - prometheus-smoke
      - "--kubeconfig={{ kubeconfig_local_path }}"
      - --
      - wget
      - -qO-
      - >-
        http://prometheus.{{ monitoring_namespace }}.svc.cluster.local:9090/api/v1/query?query={{
          'up{job="node-local-dns"}' | urlencode
        }}
  register: prometheus_node_local_dns_scrape_check
  changed_when: false
  failed_when: >-
    '"status":"success"' not in prometheus_node_local_dns_scrape_check.stdout
    or '"result":[]' in prometheus_node_local_dns_scrape_check.stdout
  when: prometheus_node_local_dns.resources | length > 0
  delegate_to: localhost

- name: Remove Prometheus smoke pod
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    name: prometheus-smoke
    namespace: "{{ monitoring_namespace }}"
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost

- name: Show Prometheus service endpoint
  ansible.builtin.debug:
    msg: "Prometheus is healthy at http://prometheus.{{ monitoring_namespace }}.svc.cluster.local:9090"
