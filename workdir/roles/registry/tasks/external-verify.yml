---
- name: Check if external IP is configured
  ansible.builtin.assert:
    that:
      - registry_service_type == "LoadBalancer"
      - registry_lb_ip | length > 0
    fail_msg: >
      External registry verification skipped: either MetalLB is disabled
      or no loadBalancer IP is defined.
    success_msg: "MetalLB external IP correctly configured: {{ registry_lb_ip }}"

- name: Wait for registry to be reachable at {{ registry_lb_ip }}
  ansible.builtin.uri:
    url: "https://{{ registry_lb_ip }}:{{ registry_external_port }}/v2/"
    method: GET
    url_username: "{{ registry_admin_username }}"
    url_password: "{{ registry_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ registry_ca_cert_path }}"
    return_content: true
    status_code: 200
  register: external_response
  retries: 10
  delay: 5
  until: external_response.status == 200
  delegate_to: localhost
  no_log: true

- name: Debug external registry test
  ansible.builtin.debug:
    msg: "Registry reachable with verified TLS at https://{{ registry_lb_ip }}:{{ registry_external_port }}/v2/"
