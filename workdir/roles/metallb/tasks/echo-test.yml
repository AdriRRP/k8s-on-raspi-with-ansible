---
- name: Deploy echo-server pod
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Pod
      metadata:
        name: echo-server
        namespace: default
        labels:
          app: echo-server
      spec:
        automountServiceAccountToken: false
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: echo
            image: "{{ platform_smoke_test_image }}"
            command:
              - httpd
              - -f
              - -p
              - "8080"
              - -h
              - /etc
            ports:
              - containerPort: 8080
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost

- name: Wait for echo-server pod to be Running
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: default
    name: echo-server
    kubeconfig: "{{ kubeconfig_local_path }}"
  register: echo_pod
  until: echo_pod.resources | length > 0 and echo_pod.resources[0].status.phase == "Running"
  retries: 10
  delay: 6
  delegate_to: localhost

- name: Create LoadBalancer service for echo-server
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: echo-service
        namespace: default
      spec:
        type: LoadBalancer
        selector:
          app: echo-server
        ports:
          - port: 80
            targetPort: 8080
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost

- name: Wait for external IP to be assigned
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kubeconfig_local_path }} get svc echo-service -n default \
      -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  register: echo_service_ip
  retries: 10
  delay: 5
  until: echo_service_ip.stdout != ""
  changed_when: false
  delegate_to: localhost

- name: Wait until echo-service is reachable via MetalLB IP
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Pod
      metadata:
        name: metallb-reachability-probe
        namespace: default
        labels:
          app: metallb-reachability-probe
      spec:
        automountServiceAccountToken: false
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        restartPolicy: Always
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: probe
            image: "{{ platform_smoke_test_image }}"
            command:
              - sh
              - -c
              - sleep 3600
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost

- name: Wait for host-network reachability probe pod to be Running
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: default
    name: metallb-reachability-probe
    kubeconfig: "{{ kubeconfig_local_path }}"
  register: metallb_reachability_probe
  until: >-
    metallb_reachability_probe.resources | length > 0
    and metallb_reachability_probe.resources[0].status.phase == "Running"
  retries: 10
  delay: 6
  delegate_to: localhost

- name: Wait until echo-service is reachable via MetalLB IP from node network
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - --namespace=default
      - metallb-reachability-probe
      - "--kubeconfig={{ kubeconfig_local_path }}"
      - --
      - wget
      - -qO-
      - --timeout=5
      - "http://{{ echo_service_ip.stdout }}/hostname"
  register: echo_response
  changed_when: false
  retries: 10
  delay: 5
  until: echo_response.rc == 0
  delegate_to: localhost

- name: Debug echo response
  ansible.builtin.debug:
    msg: "MetalLB test successful from node network: echo service responded from {{ echo_service_ip.stdout }}"

- name: Clean up reachability probe pod
  kubernetes.core.k8s:
    state: absent
    kind: Pod
    name: metallb-reachability-probe
    namespace: default
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost

- name: Clean up test pod
  kubernetes.core.k8s:
    state: absent
    kind: Pod
    name: echo-server
    namespace: default
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost

- name: Clean up test service
  kubernetes.core.k8s:
    state: absent
    kind: Service
    name: echo-service
    namespace: default
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost
