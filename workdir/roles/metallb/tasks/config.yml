---
- name: Create IPAddressPool for MetalLB
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: "{{ metallb_address_pool.name }}"
        namespace: "{{ metallb_namespace }}"
      spec:
        addresses: "{{ metallb_address_pool.addresses }}"
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost

- name: Create L2Advertisement for MetalLB
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: l2adv
        namespace: "{{ metallb_namespace }}"
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost
