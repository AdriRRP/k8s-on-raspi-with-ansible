---
- name: Ensure join command exists in control node
  ansible.builtin.stat:
    path: "{{ kubernetes_outputs }}/kubeadm_join_cmd.sh"
  delegate_to: localhost
  register: join_cmd_check

- name: Fail if join command is missing
  ansible.builtin.fail:
    msg: "Join command not found in {{ kubernetes_outputs }}/kubeadm_join_cmd.sh. Please run the init phase first."
  when: not join_cmd_check.stat.exists
  delegate_to: localhost

- name: Copy join command locally to each node
  ansible.builtin.copy:
    src: "{{ kubernetes_outputs }}/kubeadm_join_cmd.sh"
    dest: /tmp/kubeadm_join_cmd.sh
    mode: '0700'
  become: true

- name: Execute kubeadm join on each node
  ansible.builtin.command: sh /tmp/kubeadm_join_cmd.sh
  become: true
  args:
    creates: /etc/kubernetes/kubelet.conf

- name: Remove join command from node
  ansible.builtin.file:
    path: /tmp/kubeadm_join_cmd.sh
    state: absent
  become: true
