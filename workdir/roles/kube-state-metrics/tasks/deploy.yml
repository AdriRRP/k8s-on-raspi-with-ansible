---
- name: Create ServiceAccount for kube-state-metrics
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'ksm-serviceaccount.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Deploy kube-state-metrics Deployment
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'ksm-deployment.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Deploy kube-state-metrics Service
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'ksm-service.yml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_local_path }}"

- name: Get Prometheus LoadBalancer IP
  shell: >
    kubectl get svc -n {{ monitoring_namespace }} prometheus
    -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
    --kubeconfig={{ kubeconfig_local_path }}
  register: prometheus_ip
  changed_when: false

- name: Wait until Prometheus sees kube-state-metrics as UP
  uri:
    url: "http://{{ prometheus_ip.stdout }}:9090/api/v1/query?query=up{job='kube-state-metrics'}"
    method: GET
    return_content: true
    status_code: 200
  register: ksm_up
  retries: 5
  delay: 10
  until: >
    ksm_up.json is defined and
    ksm_up.json.status == "success" and
    ksm_up.json.data.result | length > 0 and
    (ksm_up.json.data.result | map(attribute='value') | map('last') | map('float') | list | first) == 1.0
  changed_when: false

- name: Confirm Prometheus is scraping kube-state-metrics successfully
  ansible.builtin.debug:
    msg: "Prometheus is scraping kube-state-metrics ({{ ksm_up.json.data.result | length }} target(s) UP)."
