---
- name: Create namespace for NFS provisioner
  kubernetes.core.k8s:
    state: present
    kind: Namespace
    name: "{{ nfs_namespace }}"
    kubeconfig: "{{ kubeconfig_local_path }}"
  delegate_to: localhost

- name: Deploy NFS provisioner (Deployment + RBAC)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ nfs_provisioner_name }}"
        namespace: "{{ nfs_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: "{{ nfs_provisioner_name }}"
        template:
          metadata:
            labels:
              app: "{{ nfs_provisioner_name }}"
          spec:
            containers:
              - name: nfs-client-provisioner
                image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
                volumeMounts:
                  - name: nfs-volume
                    mountPath: /persistentvolumes
                env:
                  - name: PROVISIONER_NAME
                    value: "example.com/{{ storage_class_name }}"
                  - name: NFS_SERVER
                    value: "{{ nfs_server }}"
                  - name: NFS_PATH
                    value: "{{ nfs_path }}"
            volumes:
              - name: nfs-volume
                nfs:
                  server: "{{ nfs_server }}"
                  path: "{{ nfs_path }}"
  delegate_to: localhost

- name: Create RBAC resources
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: "{{ nfs_provisioner_name }}"
      rules:
        - apiGroups: [""]
          resources: ["persistentvolumes"]
          verbs: ["get", "list", "watch", "create", "delete"]
        - apiGroups: [""]
          resources: ["persistentvolumeclaims"]
          verbs: ["get", "list", "watch", "update"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["storageclasses"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "update", "patch"]
        - apiGroups: [""]
          resources: ["endpoints"]
          verbs: ["create", "delete", "get", "list", "watch", "patch", "update"]
  delegate_to: localhost

- name: Create ClusterRoleBinding
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "{{ nfs_provisioner_name }}"
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ nfs_namespace }}"
      roleRef:
        kind: ClusterRole
        name: "{{ nfs_provisioner_name }}"
        apiGroup: rbac.authorization.k8s.io
  delegate_to: localhost

- name: Create StorageClass
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ storage_class_name }}"
        annotations:
          storageclass.kubernetes.io/is-default-class: "{{ 'true' if set_storageclass_default else 'false' }}"
      provisioner: "example.com/{{ storage_class_name }}"
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
  delegate_to: localhost
