---
# Step 1: Add known_hosts entries BEFORE trying to connect
- name: Ensure node host keys are trusted
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure local SSH directory exists
      ansible.builtin.file:
        path: /home/ansible/.ssh
        state: directory
        mode: "0700"

    - name: Scan and add each node to known_hosts
      ansible.builtin.known_hosts:
        name: "{{ hostvars[item].ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -H ' + hostvars[item].ansible_host) }}"
        path: /home/ansible/.ssh/known_hosts
        state: present
      loop: "{{ groups['all'] }}"
      when: hostvars[item].ansible_host is defined
      tags: ssh

# Step 2: Bootstrap RPi nodes
- name: Bootstrap Raspberry Pi nodes using default user
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: common
    - role: user_management
