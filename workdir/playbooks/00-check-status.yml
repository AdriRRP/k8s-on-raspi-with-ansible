---
- name: Check status and gather system information from all nodes
  hosts: cluster
  gather_facts: true
  any_errors_fatal: false

  tasks:
    - name: Confirm node is reachable
      ansible.builtin.debug:
        msg: "Node {{ inventory_hostname }} is reachable"

    - name: Show CPU information
      ansible.builtin.debug:
        msg: "{{ ansible_facts.processor }}"

    - name: Show total memory (in MB)
      ansible.builtin.debug:
        msg: "{{ ansible_facts.memtotal_mb }}"

    - name: Show disk usage (root mount point)
      ansible.builtin.debug:
        msg: "{{ ansible_facts.mounts }}"

    - name: Show network interfaces
      ansible.builtin.debug:
        msg: "{{ ansible_facts.interfaces }}"

    - name: Show operating system and architecture
      ansible.builtin.debug:
        msg: >-
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
          ({{ ansible_facts.architecture }})
