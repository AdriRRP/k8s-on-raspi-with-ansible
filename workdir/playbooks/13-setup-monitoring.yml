---
- name: Deploy lightweight monitoring stack (Prometheus + Grafana + Exporters)
  hosts: localhost
  gather_facts: false

  vars:
    preflight_require_storage_class: true
    preflight_storage_class_name: "{{ storage_class_name | default('raspi-nfs-provisioner') }}"
    preflight_require_loadbalancer_support: "{{ prometheus_service_type == 'LoadBalancer' or grafana_service_type == 'LoadBalancer' }}"

  roles:
    - role: cluster_preflight
    - prometheus
    - node_exporter
    - kube_state_metrics
    - metrics_server
    - grafana
    - observability_verify
