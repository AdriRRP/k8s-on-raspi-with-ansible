    registry_image: >-
      ghcr.io/project-zot/zot:v2.1.20@sha256:542e25be4d32e7879c0cfad93492a93c81b1e059cbd2d30d485d4bd567318234
  validation:
    smoke_test_image: >-
      busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0

platform_smoke_test_image: "{{ platform_release_catalog.validation.smoke_test_image }}"

kubeconfig_local_path: /home/ansible/.kube/config
kubernetes_outputs: /home/ansible/.kube/outputs
kubernetes_version: "{{ platform_release_catalog.kubernetes.install_version }}"
kubernetes_minor_version: "{{ kubernetes_version.split('.')[:2] | join('.') }}"
kubernetes_deb_revision: >-
  {{
    platform_release_catalog.kubernetes.deb_revisions_by_version[
      platform_release_catalog.kubernetes.install_version
    ]
    if (
      platform_release_catalog.kubernetes.deb_revisions_by_version is defined
      and platform_release_catalog.kubernetes.install_version
      in platform_release_catalog.kubernetes.deb_revisions_by_version
    )
    else platform_release_catalog.kubernetes.deb_revision
  }}

monitoring_namespace: monitoring
monitoring_service_type: ClusterIP

prometheus_service_type: "{{ monitoring_service_type }}"
grafana_service_type: "{{ monitoring_service_type }}"

# kubeadm uses self-signed kubelet serving certificates unless a separate
# serving-certificate approval workflow is configured.
metrics_server_kubelet_insecure_tls: true

grafana_admin_user: admin
grafana_admin_password_file: "{{ kubernetes_outputs }}/grafana-admin-password"
grafana_admin_password: >-
  {{ lookup('ansible.builtin.password', grafana_admin_password_file ~ ' length=24 chars=ascii_letters,digits') }}

registry_service_type: LoadBalancer
registry_expose_lb: true
registry_persistence_enabled: true
registry_storage_class_name: raspi-nfs-provisioner
registry_pvc_size: 20Gi
registry_lb_ip: "192.168.0.240"
registry_external_port: 443
registry_tls_enabled: true
registry_hostname: registry.home.arpa
registry_admin_username: registry-admin
registry_certificate_validity_days: 90
registry_certificate_renewal_days: 30
registry_pki_dir: "{{ kubernetes_outputs }}/registry-pki"
registry_credentials_file: "{{ kubernetes_outputs }}/registry-credentials"
registry_gc_delay: 6h
registry_gc_interval: 24h
registry_scrub_interval: 168h

set_storageclass_default: true

# Flash-backed Raspberry Pi nodes benefit from volatile node-service logs.
# Application logs remain available via `kubectl logs`, while node-local journal
# writes stay in RAM unless you override this back to `auto`.
common_journald_storage: "volatile"

# Leave the networking dataplane conservative by default.
# If you explicitly move kube-proxy to nftables, switch Calico in lockstep.
kube_proxy_mode: "iptables"
calico_linux_dataplane: "Iptables"
pod_network_cidr: "10.244.0.0/16"
service_network_cidr: "10.96.0.0/12"

cluster_discovery_strategy: auto
cluster_discovery_cidr: ""
cluster_discovery_ssh_user: "{{ cluster_admin_user }}"
cluster_discovery_ssh_port: 22
cluster_discovery_ssh_key_path: /home/ansible/.ssh/id_ed25519
cluster_discovery_static_inventory_path: /home/ansible/workdir/inventory/hosts.ini
cluster_discovery_output_path: "{{ kubernetes_outputs }}/discovered_inventory.json"

performance_baseline_profile: observe
performance_baseline_output_root: "{{ kubernetes_outputs }}/benchmarks"
performance_baseline_run_id: ""
performance_baseline_api_samples: 15
performance_baseline_command_timeout_seconds: 15
performance_baseline_repository_revision: unknown

# Active load generation is available only through the explicit benchmark
# entrypoint. Limits are deliberately small for four Raspberry Pi nodes.
performance_benchmark_profile: active-safe
performance_benchmark_experiment: control
performance_benchmark_output_root: "{{ kubernetes_outputs }}/benchmarks-active"
performance_benchmark_api_samples: 50
performance_benchmark_pod_startup_samples: 8
performance_benchmark_dns_queries_per_node: 20
performance_benchmark_network_transfer_mib_per_node: 8

# Only one tuning experiment is applied at a time. `control` is the rollback.
performance_tuning_profile: control
performance_tuning_cpu_governor_control: ondemand
performance_tuning_cpu_governor_experiment: schedutil
performance_tuning_parallel_image_pulls: 2

node_local_dns_state: audit
node_local_dns_address: 169.254.20.10
node_local_dns_domain: cluster.local
node_local_dns_image: "{{ platform_release_catalog.networking.node_local_dns_image }}"
node_local_dns_cache_success_entries: 4096
node_local_dns_cache_denial_entries: 1024
node_local_dns_max_concurrent_queries: 100

recovery_seed_bootstrap_user: "{{ ansible_user | default('ubuntu') }}"
recovery_seed_cloud_init_package_update: false
recovery_seed_network_mode: dhcp
recovery_seed_network_required: false
recovery_seed_interface_name: eth0
recovery_seed_interface_mac: ""
recovery_seed_static_prefix: 24
recovery_seed_static_gateway: ""
recovery_seed_nameservers: []
recovery_seed_control_plane_interface_name: ""
recovery_seed_control_plane_interface_mac: ""
recovery_seed_control_plane_static_prefix: 24
recovery_seed_control_plane_static_gateway: ""
recovery_seed_control_plane_nameservers: []
recovery_node_wait_for_connection_timeout: 900
recovery_node_wait_for_connection_delay: 5
recovery_known_hosts_path: /home/ansible/.ssh/known_hosts

upgrade_target_kubernetes_version: ""
upgrade_target_os_version: ""
upgrade_target_kubernetes_deb_revision: "{{ kubernetes_deb_revision }}"
upgrade_execution_mode: dry-run
upgrade_maintenance_scope: cluster
upgrade_plan_file: "{{ kubernetes_outputs }}/upgrade-plan.json"
upgrade_require_kubeadm_plan: true
upgrade_capture_snapshots: true
upgrade_snapshot_dir: "{{ kubernetes_outputs }}/upgrade-snapshots"
upgrade_run_id: "{{ lookup('ansible.builtin.pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
upgrade_pre_snapshot_file: "{{ upgrade_snapshot_dir }}/{{ upgrade_run_id }}-pre.json"
upgrade_post_snapshot_file: "{{ upgrade_snapshot_dir }}/{{ upgrade_run_id }}-post.json"
upgrade_failure_dir: "{{ kubernetes_outputs }}/upgrade-failures/{{ upgrade_run_id }}"
upgrade_reconcile_platform_addons: true
upgrade_reconcile_runtime: true
upgrade_enforce_replicated_workloads: true
upgrade_require_pdb_protection: true
upgrade_allow_single_replica_workloads: false
upgrade_replicated_workload_exempt_namespaces:
  - kube-system
  - metallb-system
  - monitoring
  - registry
upgrade_workload_safety_exemptions:
  - calico-system/calico-kube-controllers
  - calico-system/goldmane
  - calico-system/whisker
  - nfs-storage/nfs-subdir-external-provisioner
  - tigera-operator/tigera-operator
upgrade_os_patch_nodes: false
upgrade_os_release_nodes: false
upgrade_reboot_after_os_patch: true
upgrade_worker_auto_package_rollback: false
upgrade_control_plane_auto_package_rollback: false
upgrade_drain_timeout: 10m
upgrade_drain_grace_period: 30
upgrade_delete_emptydir_data: true
upgrade_force_drain: false
