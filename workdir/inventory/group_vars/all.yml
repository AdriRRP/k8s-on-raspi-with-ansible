      "22.04": "24.04"
      "24.04": "26.04"
      "24.10": "26.04"
      "25.04": "25.10"
      "25.10": "26.04"
    release_upgrade_prerequisites:
      "26.04":
        distro_info_data:
          version: "0.68ubuntu0.1"
