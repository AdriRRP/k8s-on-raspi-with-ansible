[defaults]
inventory = ./inventory/hosts.ini
roles_path = ./roles
collections_path = /home/ansible/.ansible/collections:/usr/share/ansible/collections
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
bin_ansible_callbacks = True
forks = 10
timeout = 30
gathering = smart

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/home/ansible/.ssh/known_hosts
