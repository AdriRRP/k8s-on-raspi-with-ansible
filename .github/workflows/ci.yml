---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Ansible and Control Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build control image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: ansible-k8s-raspberry-audit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check cluster-control shell syntax
        run: bash -n cluster-control.sh

      - name: Check diff formatting
        run: git diff --check

      - name: Run repository validation
        run: >
          docker run --rm
          --security-opt no-new-privileges
          -v "$PWD:/src:ro"
          -w /src
          ansible-k8s-raspberry-audit:ci
          ./tools/validate.sh
