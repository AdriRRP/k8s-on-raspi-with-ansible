---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Ansible and Control Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build control image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: ansible-k8s-raspberry-audit:ci
          cache-from: type=gha,scope=control-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=control-image-${{ matrix.arch }}

      - name: Check cluster-control shell syntax
        run: bash -n cluster-control.sh

      - name: Check diff formatting
        run: git diff --check

      - name: Run repository validation
        run: >
          docker run --rm
          --security-opt no-new-privileges
          -v "$PWD:/src:ro"
          -w /src
          ansible-k8s-raspberry-audit:ci
          ./tools/validate.sh

      - name: Generate control-image SBOM
        if: matrix.arch == 'amd64'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          artifact-name: control-image-sbom.spdx.json
          image: ansible-k8s-raspberry-audit:ci
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Scan control image for fixable vulnerabilities
        if: matrix.arch == 'amd64'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          cache-db: true
          fail-build: true
          image: ansible-k8s-raspberry-audit:ci
          only-fixed: true
          output-format: table
          severity-cutoff: critical

      - name: Audit stable upstream releases
        if: github.event_name == 'schedule' && matrix.arch == 'amd64'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          docker run --rm
          --security-opt no-new-privileges
          --env GITHUB_TOKEN
          -v "$PWD/workdir:/home/ansible/workdir:ro"
          ansible-k8s-raspberry-audit:ci
          python3 tools/release_catalog_audit.py
